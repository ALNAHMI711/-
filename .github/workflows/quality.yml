name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required baseline files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f README_AR.md
          test -f .gitignore
          test -f .env.example
          test -f SECURITY.md
          test -f docs/PIPELINE.md
          test -f Dockerfile
          test -f docker-compose.yml
          test ! -f .env
          echo "Baseline files: OK"
      - name: Basic secret-pattern guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='quality.yml' '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,})' .; then
            echo "Potential hard-coded secret detected"
            exit 1
          fi
          echo "Secret-pattern guard: OK"

  application-bootstrap:
    name: Application bootstrap and tests
    runs-on: ubuntu-latest
    needs: repository-integrity
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app tests
      - name: Run unit and Redis integration tests
        run: python -m pytest -q

  container-smoke:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: application-bootstrap
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag mashahid:test .
      - name: Start container
        run: docker run --detach --rm --name mashahid-test -p 18000:8000 mashahid:test
      - name: Wait for health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18000/healthz; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs mashahid-test
          exit 1
      - name: Stop container
        if: always()
        run: docker stop mashahid-test || true
